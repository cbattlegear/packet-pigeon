name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-apps-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: |
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check deployment configuration
        id: deployment
        env:
          HAS_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_STONE_004CEE510 != '' || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        run: |
          echo "enabled=$HAS_DEPLOYMENT_TOKEN" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_DEPLOYMENT_TOKEN" == true ]]; then
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::error::Configure the Azure Static Web Apps deployment token in GitHub Actions secrets."
            exit 1
          fi
          echo "::notice::Azure deployment is disabled until its deployment token is configured."

      - name: Check out source
        if: steps.deployment.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.deployment.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build Packet Pigeon
        if: steps.deployment.outputs.enabled == 'true'
        run: |
          npm ci
          npm run build

      - name: Upload the build
        if: steps.deployment.outputs.enabled == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_STONE_004CEE510 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ github.event_name == 'pull_request' && github.token || '' }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          production_branch: main

  close_pull_request_job:
    if: |
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HAS_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_STONE_004CEE510 != '' || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - name: Close the preview environment
        if: env.HAS_DEPLOYMENT_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_STONE_004CEE510 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
